name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # containerd in the host container needs a rootful, privileged container.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # ctr pulls and runs a real container, nested inside the host container.
      - name: Pull and run an image with ctr
        run: |
          sudo podman exec circuit-containerd bash -lc '
            set -eux
            systemctl is-active containerd
            systemctl is-enabled containerd
            ctr version | grep -c "Version:  *v2.4.2" | grep -x 2
            runc --version | grep -x "runc version 1.5.2"
            /opt/cni/bin/bridge 2>&1 | grep -F v1.9.1
            ctr plugins ls | grep -E "io.containerd.cri.v1 +runtime .* ok"
            ctr image pull ghcr.io/containerd/busybox:1.36
            ctr run --rm ghcr.io/containerd/busybox:1.36 smoke echo hello-from-ctr | grep -x hello-from-ctr
          '
      # Restarting the container boots systemd again, so this checks
      # containerd is enabled, comes back with the CRI plugin loaded, and
      # still runs a container, and that the plan has nothing to do.
      - name: Restart the host, then run an image again and plan again with no changes
        working-directory: examples/local
        run: |
          sudo podman restart circuit-containerd
          for _ in $(seq 60); do
            case $(sudo podman exec circuit-containerd systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          sudo podman exec circuit-containerd bash -lc '
            set -eux
            for _ in $(seq 30); do ctr version >/dev/null 2>&1 && break; sleep 1; done
            systemctl is-active containerd
            ctr plugins ls | grep -E "io.containerd.cri.v1 +runtime .* ok"
            ctr run --rm ghcr.io/containerd/busybox:1.36 smoke echo hello-after-restart | grep -x hello-after-restart
          '
          conn3x plan -detailed-exitcode
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
